name: HiddenEngine Visual Preview Render (silent)

on:
  push:
    branches:
      - feature/documentary-renderer-v2
    paths:
      - "src/render-video.js"
      - ".github/workflows/render-video.yml"
      - "production/projects/**/script.json"
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project folder ID; this render is silent visual inspection only"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install rendering tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Render silent visual preview
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node src/render-video.js

      - name: Upload MP4 and production assets
        uses: actions/upload-artifact@v4
        with:
          name: hiddenengine-visual-preview-${{ inputs.project_id || 'visual-inspection' }}
          path: dist/${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}/
          if-no-files-found: error
          retention-days: 14
