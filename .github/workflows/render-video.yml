name: HiddenEngine Cinematic Documentary Render
on:
  push:
    branches: [main]
    paths:
      - "src/render-video.js"
      - "src/import-visual-links.js"
      - "production/projects/**/visual-links.json"
      - ".github/workflows/render-video.yml"
  workflow_dispatch:
    inputs:
      project_id:
        description: "Production project folder ID"
        required: true
        default: "2026-11-12-chinas-technology-rise"
        type: string
      voice_model:
        description: "Piper voice model"
        required: true
        default: "en_US-lessac-medium"
        type: string
      speaking_rate:
        description: "Piper length scale: higher is slower"
        required: true
        default: "1.0"
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get project
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rendering tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core librsvg2-bin
      - name: Install Piper TTS and download selected voice
        env:
          PIPER_VOICE: ${{ inputs.voice_model || 'en_US-lessac-medium' }}
        run: |
          set -euo pipefail
          python3 -m venv .venv-piper
          .venv-piper/bin/pip install --upgrade pip
          .venv-piper/bin/pip install piper-tts
          lang="${PIPER_VOICE%%_*}"
          locale_and_rest="${PIPER_VOICE#*_}"
          locale="${locale_and_rest%%-*}"
          speaker_and_quality="${locale_and_rest#*-}"
          speaker="${speaker_and_quality%-*}"
          quality="${speaker_and_quality##*-}"
          mkdir -p models
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/${lang}/${lang}_${locale}/${speaker}/${quality}/${PIPER_VOICE}"
          curl -fL "$base.onnx" -o "models/${PIPER_VOICE}.onnx"
          curl -fL "$base.onnx.json" -o "models/${PIPER_VOICE}.onnx.json"
          echo "PIPER_MODEL=models/${PIPER_VOICE}.onnx" >> "$GITHUB_ENV"
          echo "PIPER_EXECUTABLE=$GITHUB_WORKSPACE/.venv-piper/bin/piper" >> "$GITHUB_ENV"
      - name: Convert owner-selected links into render manifest
        env:
          PROJECT_ID: ${{ inputs.project_id || github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            project_id="$(node -e 'const fs=require("fs");const e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH));const f=e.commits?.flatMap(c=>c.added.concat(c.modified)).find(p=>/^production\/projects\/[^/]+\/visual-links\.json$/.test(p));if(!f)process.exit(2);process.stdout.write(f.split("/")[2])')"
          else
            project_id="${{ inputs.project_id }}"
          fi
          echo "PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          PROJECT_ID="$project_id" node src/import-visual-links.js
      - name: Render using owner-selected images
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          PIPER_LENGTH_SCALE: ${{ inputs.speaking_rate || '1.0' }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            export PROJECT_ID="$(grep '^PROJECT_ID=' "$GITHUB_ENV" | tail -1 | cut -d= -f2-)"
          fi
          node src/render-video.js
      - name: Upload MP4 and production assets
        uses: actions/upload-artifact@v4
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        with:
          name: hiddenengine-cinematic-${{ inputs.project_id || 'owner-selected' }}
          path: |
            dist/**/the-hidden-engine-documentary.mp4
            dist/**/CREDITS.md
            dist/**/QA-REPORT.json
          if-no-files-found: error
          retention-days: 14
