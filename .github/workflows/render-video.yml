name: HiddenEngine Render Documentary

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Production project folder ID"
        required: true
        default: "2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re"
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install free rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core

      - name: Render documentary draft
        env:
          PROJECT_ID: \${{ inputs.project_id }}
        run: node src/render-video.js

      - name: Upload MP4 and project assets
        uses: actions/upload-artifact@v4
        with:
          name: hiddenengine-documentary-\${{ inputs.project_id }}
          path: dist/\${{ inputs.project_id }}/
          if-no-files-found: error
          retention-days: 14
