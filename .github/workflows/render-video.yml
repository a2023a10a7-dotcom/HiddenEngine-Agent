name: HiddenEngine Cinematic Documentary Render

on:
  push:
    branches:
      - feature/piper-tts-integration
    paths:
      - "src/render-video.js"
      - ".github/workflows/render-video.yml"
      - "production/projects/**/script.json"
  workflow_dispatch:
    inputs:
      project_id:
        description: "Production project folder ID"
        required: true
        type: string
      voice_model:
        description: "Piper voice model (for example en_US-lessac-medium or ar_JO-kareem-medium)"
        required: true
        default: "en_US-lessac-medium"
        type: string
      speaking_rate:
        description: "Piper length scale: lower is faster, higher is slower"
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install rendering tools and fonts
        timeout-minutes: 18
        run: |
          set -euo pipefail
          sudo timeout --signal=TERM --kill-after=30s 8m apt-get update \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          sudo timeout --signal=TERM --kill-after=30s 8m apt-get install -y ffmpeg fonts-dejavu-core \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30

      - name: Install Piper TTS and download selected voice
        env:
          PIPER_VOICE: ${{ inputs.voice_model || 'en_US-lessac-medium' }}
        run: |
          python3 -m venv .venv-piper
          .venv-piper/bin/pip install --upgrade pip
          .venv-piper/bin/pip install piper-tts
          lang="${PIPER_VOICE%%_*}"
          locale_and_rest="${PIPER_VOICE#*_}"
          locale="${locale_and_rest%%-*}"
          speaker_and_quality="${locale_and_rest#*-}"
          speaker="${speaker_and_quality%-*}"
          quality="${speaker_and_quality##*-}"
          mkdir -p models
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/${lang}/${lang}_${locale}/${speaker}/${quality}/${PIPER_VOICE}"
          curl -fL "$base.onnx" -o "models/${PIPER_VOICE}.onnx"
          curl -fL "$base.onnx.json" -o "models/${PIPER_VOICE}.onnx.json"
          echo "PIPER_MODEL=models/${PIPER_VOICE}.onnx" >> "$GITHUB_ENV"
          echo "PIPER_EXECUTABLE=$GITHUB_WORKSPACE/.venv-piper/bin/piper" >> "$GITHUB_ENV"

      - name: Render cinematic documentary
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}
          PIPER_LENGTH_SCALE: ${{ inputs.speaking_rate || '1.0' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node src/render-video.js

      - name: Generate final video contact sheet
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}
        run: |
          output="dist/${PROJECT_ID}"
          test -s "$output/the-hidden-engine-documentary.mp4"
          test -s "$output/CREDITS.md"
          test -s "$output/QA-REPORT.json"
          ffmpeg -y -i "$output/the-hidden-engine-documentary.mp4" \
            -vf "fps=1/15,scale=320:-1,tile=4x4:padding=8:margin=8:color=black" \
            -frames:v 1 "$output/contact-sheet.jpg"
          test -s "$output/contact-sheet.jpg"

      - name: Upload only the four final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: hiddenengine-cinematic-${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}
          path: |
            dist/${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}/the-hidden-engine-documentary.mp4
            dist/${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}/CREDITS.md
            dist/${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}/QA-REPORT.json
            dist/${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}/contact-sheet.jpg
          if-no-files-found: error
          retention-days: 14
