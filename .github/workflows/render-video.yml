name: HiddenEngine Cinematic Documentary Render

on:
  push:
    branches: [main]
    paths:
      - "src/render-video.js"
      - "production/projects/2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re/visual-selection.json"
      - "production/projects/2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re/visual-assets.json"
      - ".github/workflows/render-video.yml"
  workflow_dispatch:
    inputs:
      project_id:
        description: "Production project folder ID"
        required: true
        default: "2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re"
        type: string

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install rendering tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Check required voice configuration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: |
          test -n "$ELEVENLABS_API_KEY" || (echo "::error::Add ELEVENLABS_API_KEY to GitHub Actions Secrets."; exit 1)
          test -n "$ELEVENLABS_VOICE_ID" || (echo "::error::Add ELEVENLABS_VOICE_ID to GitHub Actions Variables."; exit 1)

      - name: Render cinematic documentary
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node src/render-video.js

      - name: Upload MP4 and production assets
        uses: actions/upload-artifact@v4
        with:
          name: hiddenengine-cinematic-${{ inputs.project_id || '2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re' }}
          path: dist/${{ inputs.project_id }}/
          if-no-files-found: error
          retention-days: 14
