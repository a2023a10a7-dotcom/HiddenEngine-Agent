name: HiddenEngine Cinematic Documentary Render
on:
  push:
    branches: [main]
    paths:
      - "production/projects/**/visual-links.json"
      - "production/projects/**/script.json"
      - "src/render-video.js"
      - "src/prepare-project-assets.js"
      - ".github/workflows/render-video.yml"
  workflow_dispatch:
    inputs:
      project_id:
        description: "Production project folder ID"
        required: true
        default: "2026-11-12-chinas-technology-rise"
        type: string
      voice_model:
        description: "Piper voice model"
        required: true
        default: "en_US-lessac-medium"
        type: string
      speaking_rate:
        description: "Piper length scale: higher is slower"
        required: true
        default: "1.0"
        type: string
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Get project
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install rendering tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core librsvg2-bin
      - name: Install Piper TTS and download selected voice
        env:
          PIPER_VOICE: ${{ inputs.voice_model || 'en_US-lessac-medium' }}
        run: |
          set -euo pipefail
          python3 -m venv .venv-piper
          .venv-piper/bin/pip install --upgrade pip
          .venv-piper/bin/pip install piper-tts
          lang="${PIPER_VOICE%%_*}"
          locale_and_rest="${PIPER_VOICE#*_}"
          locale="${locale_and_rest%%-*}"
          speaker_and_quality="${locale_and_rest#*-}"
          speaker="${speaker_and_quality%-*}"
          quality="${speaker_and_quality##*-}"
          mkdir -p models
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/${lang}/${lang}_${locale}/${speaker}/${quality}/${PIPER_VOICE}"
          curl -fL "$base.onnx" -o "models/${PIPER_VOICE}.onnx"
          curl -fL "$base.onnx.json" -o "models/${PIPER_VOICE}.onnx.json"
          echo "PIPER_MODEL=models/${PIPER_VOICE}.onnx" >> "$GITHUB_ENV"
          echo "PIPER_EXECUTABLE=$GITHUB_WORKSPACE/.venv-piper/bin/piper" >> "$GITHUB_ENV"
      - name: Prepare unique narration-matched visuals
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            project_path="$(git diff-tree --no-commit-id --name-only -r HEAD | awk -F/ '$1=="production" && $2=="projects" && ($4=="visual-links.json" || $4=="script.json") {print; exit}')"
            if [[ -z "$project_path" ]]; then
              project_id="2026-11-12-chinas-technology-rise"
              echo "No project asset changed; using the configured China documentary project: $project_id"
            else
              project_id="$(cut -d/ -f3 <<< "$project_path")"
            fi
          else
            project_id="${{ inputs.project_id }}"
          fi
          echo "PROJECT_ID=$project_id" >> "$GITHUB_ENV"
          PROJECT_ID="$project_id" node src/prepare-project-assets.js
      - name: Render using narration-matched visuals
        env:
          PIPER_LENGTH_SCALE: ${{ inputs.speaking_rate || '1.0' }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          node src/render-video.js
      - name: Upload MP4 and production assets
        uses: actions/upload-artifact@v4
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        with:
          name: hiddenengine-cinematic-${{ inputs.project_id || 'owner-selected' }}
          path: |
            dist/**/the-hidden-engine-documentary.mp4
            dist/**/CREDITS.md
            dist/**/QA-REPORT.json
            dist/**/contact-sheet.jpg
            dist/**/VISUAL-AUDIT.json
            dist/**/visual-selection.json
            dist/**/visual-assets.json
            dist/**/visual-credits.json
            dist/**/README.txt
          if-no-files-found: error
          retention-days: 14
