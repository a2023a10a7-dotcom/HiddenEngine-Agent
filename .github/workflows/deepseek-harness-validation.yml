name: DeepSeek Harness Integration Validation

on:
  push:
    branches: [main, integration/deepseek-harness]
    paths:
      - "integrations/deepseek-harness/**"
      - "package.json"
      - ".github/workflows/deepseek-harness-validation.yml"
  pull_request:
    paths:
      - "integrations/deepseek-harness/**"
      - "package.json"
      - ".github/workflows/deepseek-harness-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Harness plugin TypeScript syntax
        run: |
          npx --yes esbuild@0.25.0 integrations/deepseek-harness/hiddenengine-tools.ts --format=esm --platform=node --external:@deepseek-ai/cordis --external:@deepseek-ai/dsh-tools --outfile=/tmp/hiddenengine-tools.js
          node --check /tmp/hiddenengine-tools.js
      - name: Check launcher shell syntax
        run: bash -n integrations/deepseek-harness/launch.sh
      - name: Check package manifest
        run: node -e "const p=require('./package.json'); if(p.scripts.harness!=='bash integrations/deepseek-harness/launch.sh') process.exit(1)"
