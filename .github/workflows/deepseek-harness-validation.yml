name: DeepSeek Harness Integration Validation

on:
  pull_request:
    paths:
      - "integrations/deepseek-harness/**"
      - "package.json"
      - ".github/workflows/deepseek-harness-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - name: Check Harness plugin TypeScript syntax
        run: |
          npx --yes esbuild@0.25.0 integrations/deepseek-harness/hiddenengine-tools.ts --bundle --format=esm --platform=node --external:@deepseek-ai/cordis --external:@deepseek-ai/dsh-tools --outfile=/tmp/hiddenengine-tools.js
          node --check /tmp/hiddenengine-tools.js
      - name: Check launcher shell syntax
        run: bash -n integrations/deepseek-harness/launch.sh
      - name: Check package manifest
        run: node -e "const p=require('./package.json'); if(p.scripts.harness!=='bash integrations/deepseek-harness/launch.sh') process.exit(1)"
      - name: Install the pinned official Harness source and dependencies
        run: |
          set -euo pipefail
          DSH_DIR="${RUNNER_TEMP}/deepseek-harness-source"
          DSH_REF="4b399c39a6d1479cd84ca591b4d7c88e24d38a96"
          git clone --no-checkout https://github.com/deepseek-ai/deepseek-harness.git "$DSH_DIR"
          git -C "$DSH_DIR" fetch --depth=1 origin "$DSH_REF"
          git -C "$DSH_DIR" checkout --detach "$DSH_REF"
          npm install --global pnpm@11.28.5
          cd "$DSH_DIR"
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Smoke-test the real DeepSeek Harness plugin loader
        run: |
          set -euo pipefail
          DSH_DIR="${RUNNER_TEMP}/deepseek-harness-source"
          PLUGIN_DIR="$DSH_DIR/scratch-plugin/src"
          PATCH_FILE="${RUNNER_TEMP}/hiddenengine-dsh.yml"
          LOG_FILE="${RUNNER_TEMP}/deepseek-harness.log"
          mkdir -p "$PLUGIN_DIR"
          cp integrations/deepseek-harness/hiddenengine-tools.ts "$PLUGIN_DIR/hiddenengine-tools.ts"
          cat > "$PATCH_FILE" <<YAML
          - insert:
              - id: hiddenengine-production-tools
                name: '$PLUGIN_DIR/hiddenengine-tools.ts'
          YAML
          cd "$DSH_DIR"
          pnpm dsh web --patch "$PATCH_FILE" --no-open > "$LOG_FILE" 2>&1 &
          DSH_PID=$!
          cleanup() {
            kill "$DSH_PID" 2>/dev/null || true
            wait "$DSH_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          loaded=0
          for attempt in $(seq 1 90); do
            if grep -q "DeepSeek Harness plugin loaded; four production tools registered" "$LOG_FILE"; then
              loaded=1
              break
            fi
            if ! kill -0 "$DSH_PID" 2>/dev/null; then
              cat "$LOG_FILE"
              echo "DeepSeek Harness exited before loading the HiddenEngine plugin." >&2
              exit 1
            fi
            sleep 2
          done
          if [ "$loaded" -ne 1 ]; then
            cat "$LOG_FILE"
            echo "Timed out waiting for the HiddenEngine plugin to load in DeepSeek Harness." >&2
            exit 1
          fi
          echo "DeepSeek Harness loaded the HiddenEngine plugin and registered its four tools."
