name: Repository Integrity

on:
  push:
    branches:
      - feature/documentary-renderer-v2
    paths:
      - "src/**/*.js"
      - "scripts/**/*.js"
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/repo-integrity.yml"
  pull_request:
    paths:
      - "src/**/*.js"
      - "scripts/**/*.js"
      - ".github/workflows/pipeline.yml"
      - ".github/workflows/repo-integrity.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax and pipeline references
        run: node scripts/validate-repository.js
