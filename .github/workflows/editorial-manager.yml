name: HiddenEngine Editorial Manager

on:
  workflow_dispatch:
  schedule:
    - cron: "30 10 * * 0"
  workflow_run:
    workflows: ["HiddenEngine Weekly Research"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: hiddenengine-editorial-manager
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run editorial manager
        run: node src/editorial-manager.js
      - name: Save manager report
        run: |
          git config user.name "HiddenEngine Agent"
          git config user.email "agent@users.noreply.github.com"
          git add reports/manager-report.json reports/manager-report.md
          git diff --cached --quiet || git commit -m "Generate weekly editorial manager report"
          git push
