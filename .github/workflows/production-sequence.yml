name: HiddenEngine Sequential Production

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project folder name"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: hiddenengine-sequence-${{ inputs.project_id }}
  cancel-in-progress: false

jobs:
  production-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^[a-z0-9-]+$ ]]
          test -f "production/projects/$PROJECT_ID/project.json"

      - name: 1. Evidence audit
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: node src/evidence-audit.js

      - name: 2. Build script architecture
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: node src/script-architect.js

      - name: 3. Assemble evidence-linked script draft
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: node src/script-writer.js

      - name: 4. Build visual direction
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: node src/visual-director.js

      - name: 5. Compile renderer script
        env:
          PROJECT_ID: ${{ inputs.project_id }}
          FORCE: "1"
        run: node src/script-compile.js

      - name: 6. Run script gate
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: node src/script-gate.js

      - name: Save successful or partial project outputs
        if: always()
        env:
          PROJECT_ID: ${{ inputs.project_id }}
        run: |
          set -euo pipefail
          git config user.name "HiddenEngine Agent"
          git config user.email "agent@users.noreply.github.com"
          git add "production/projects/$PROJECT_ID/"
          if ! git diff --cached --quiet; then
            git commit -m "Sequential production pipeline: $PROJECT_ID"
            git push
          else
            echo "No project-file changes to save."
          fi

      - name: Upload fact-check and evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiddenengine-sequence-${{ inputs.project_id }}
          path: |
            dist/${{ inputs.project_id }}/FACT-CHECK-SHEET.md
            production/projects/${{ inputs.project_id }}/EVIDENCE-AUDIT.json
            production/projects/${{ inputs.project_id }}/SCRIPT-ARCHITECTURE.json
            production/projects/${{ inputs.project_id }}/SCRIPT-DRAFT.md
            production/projects/${{ inputs.project_id }}/script.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Editorial checkpoint
        if: success()
        run: |
          echo "All automated stages passed."
          echo "STOP: human editorial approval and source-passage review are required before voice generation or rendering."
