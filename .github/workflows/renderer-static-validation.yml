name: Documentary Renderer Static Validation

on:
  push:
    branches: [main]
    paths:
      - "src/render-video.js"
      - "production/projects/**/visual-selection.json"
      - "production/projects/**/visual-assets.json"
      - ".github/workflows/renderer-static-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate renderer syntax
        run: node --check src/render-video.js
      - name: Validate selected visual assets
        env:
          PROJECT_ID: 2026-11-08-why-a-new-report-on-anthropic-automating-ai-development-is-alarming-re
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const root = 'production/projects/' + process.env.PROJECT_ID + '/';
          const selection = JSON.parse(await readFile(root + 'visual-selection.json', 'utf8'));
          const manifest = JSON.parse(await readFile(root + 'visual-assets.json', 'utf8'));
          const assets = new Map(manifest.assets.map(x => [x.id, x]));
          const selected = selection.scenes.flatMap(s => s.selectedImageIds.map(id => ({scene:s.scene,id})));
          if (selected.length !== 14) throw new Error('Expected 14 selected images; found ' + selected.length);
          for (const item of selected) {
            const asset = assets.get(item.id);
            if (!asset || asset.scene !== item.scene) throw new Error('Missing or misassigned image ' + item.id);
            if (!asset.sourcePage.startsWith('https://pixabay.com/')) throw new Error('Untrusted source page for ' + item.id);
          }
          if (manifest.assets.length !== 14) throw new Error('Expected 14 asset records');
          console.log('Validated ' + selected.length + ' selected images across ' + selection.scenes.length + ' scenes.');
          NODE
