name: Documentary Renderer Static Validation

on:
  push:
    branches: [main]
    paths:
      - "src/render-video.js"
      - "src/prepare-project-assets.js"
      - "production/projects/2026-11-12-chinas-technology-rise/script.json"
      - "production/projects/**/visual-selection.json"
      - "production/projects/**/visual-assets.json"
      - ".github/workflows/renderer-static-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate renderer syntax
        run: node --check src/render-video.js
      - name: Validate 15-minute documentary script
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const script = JSON.parse(await readFile('production/projects/2026-11-12-chinas-technology-rise/script.json', 'utf8'));
          if (script.scenes.length < 14) throw new Error('Documentary must contain at least 14 chapters.');
          const words = script.scenes.reduce((n, scene) => n + scene.narration.trim().split(/\\s+/).length, 0);
          if (words < 2100) throw new Error('Narration is too short for a 15-minute documentary: ' + words + ' words.');
          for (const [i, scene] of script.scenes.entries()) {
            if (!scene.visual_queries || scene.visual_queries.length < 4) throw new Error('Scene ' + (i + 1) + ' needs at least four visual search queries.');
            if (!scene.visual_requirements || scene.visual_requirements.length < 2) throw new Error('Scene ' + (i + 1) + ' needs specific visual matching requirements.');
          }
          console.log('Validated ' + words + ' narration words across ' + script.scenes.length + ' scenes.');
          NODE
