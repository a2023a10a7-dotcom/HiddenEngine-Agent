name: HiddenEngine Pipeline

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Pipeline stage to run"
        required: true
        type: choice
        options:
          - new
          - research
          - ingest
          - claims-packet
          - claims-import
          - evidence-audit
          - script-plan
          - write-script
          - visual-plan
          - compile
          - gate
      project_id:
        description: "Project folder name (not needed for stage: new)"
        required: false
        type: string
      topic:
        description: "Topic (only for stage: new)"
        required: false
        type: string
      duration_seconds:
        description: "Target duration in seconds (only for stage: new)"
        required: false
        default: "480"
        type: string

permissions:
  contents: write

concurrency:
  group: hiddenengine-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run stage
        id: stage
        continue-on-error: true
        env:
          STAGE: ${{ inputs.stage }}
          PROJECT_ID: ${{ inputs.project_id }}
          TOPIC: ${{ inputs.topic }}
          DURATION: ${{ inputs.duration_seconds }}
        run: |
          set -euo pipefail
          if [ "$STAGE" != "new" ] && [ -z "${PROJECT_ID:-}" ]; then echo "project_id is required for stage $STAGE"; exit 1; fi
          case "$STAGE" in
            new)
              if [ -z "${TOPIC:-}" ]; then echo "topic is required for stage new"; exit 1; fi
              node src/documentary-engine.js --topic "$TOPIC" --language en --duration "${DURATION:-480}" ;;
            research)       node src/research-agent.js ;;
            ingest)         node src/source-ingest.js ;;
            claims-packet)  node src/claims-packet.js ;;
            claims-import)  node src/claims-import.js ;;
            evidence-audit) node src/evidence-audit.js ;;
            script-plan)    node src/script-architect.js ;;
            write-script)   node src/script-writer.js ;;
            visual-plan)    node src/visual-director.js ;;
            compile)        node src/script-compile.js && node src/script-gate.js ;;
            gate)           node src/script-gate.js ;;
          esac
      - name: Save outputs
        run: |
          git config user.name "HiddenEngine Agent"
          git config user.email "agent@users.noreply.github.com"
          git add production/projects/
          git diff --cached --quiet || git commit -m "Pipeline stage: ${{ inputs.stage }}"
          git push
      - name: Report stage result
        if: steps.stage.outcome == 'failure'
        run: |
          echo "Stage ${{ inputs.stage }} reported problems. Partial outputs were saved. Open the 'Run stage' step log."
          exit 1
