name: HiddenEngine Sequential Production

on:
  push:
    branches: [feature/beats-pipeline]
    paths:
      - "production/projects/2026-11-14-nvidia-hidden-engine/project.json"
      - "src/script-architect.js"
      - "src/script-writer.js"
      - "src/script-compile.js"
      - "src/script-gate.js"
      - "src/render-cards.js"
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project folder name"
        required: true
        default: "2026-11-14-nvidia-hidden-engine"
        type: string
      dry_run:
        description: "Render a silent test instead of final voice"
        required: true
        default: false
        type: boolean
      ambient_bed:
        description: "Add a quiet original ambient music bed"
        required: true
        default: true
        type: boolean
      voice_model:
        description: "Piper voice model"
        required: true
        default: "en_US-lessac-medium"
        type: string
      speaking_rate:
        description: "Piper length scale: higher is slower"
        required: true
        default: "1.0"
        type: string

permissions:
  contents: read

concurrency:
  group: hiddenengine-sequential-${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/beats-pipeline

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Validate project input
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
        run: |
          set -euo pipefail
          [[ "$PROJECT_ID" =~ ^[a-z0-9-]+$ ]]
          test -f "production/projects/$PROJECT_ID/project.json"

      - name: 1. Evidence audit
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
        run: node src/evidence-audit.js

      - name: 2. Build script architecture
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
        run: node src/script-architect.js

      - name: 3. Assemble evidence-linked script draft
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
        run: node src/script-writer.js

      - name: 4. Build visual direction and asset register
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
        run: node src/visual-director.js

      - name: 5. Compile beats into renderer script
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
          FORCE: "1"
        run: node src/script-compile.js

      - name: 6. Script gate
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
        run: node src/script-gate.js

      - name: Install rendering tools and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core librsvg2-bin

      - name: Install Piper TTS and voice
        if: ${{ inputs.dry_run != true }}
        env:
          PIPER_VOICE: ${{ inputs.voice_model || 'en_US-lessac-medium' }}
        run: |
          set -euo pipefail
          python3 -m venv .venv-piper
          .venv-piper/bin/pip install --upgrade pip
          .venv-piper/bin/pip install piper-tts
          lang="${PIPER_VOICE%%_*}"
          locale_and_rest="${PIPER_VOICE#*_}"
          locale="${locale_and_rest%%-*}"
          speaker_and_quality="${locale_and_rest#*-}"
          speaker="${speaker_and_quality%-*}"
          quality="${speaker_and_quality##*-}"
          mkdir -p models
          base="https://huggingface.co/rhasspy/piper-voices/resolve/main/${lang}/${lang}_${locale}/${speaker}/${quality}/${PIPER_VOICE}"
          curl -fL "$base.onnx" -o "models/${PIPER_VOICE}.onnx"
          curl -fL "$base.onnx.json" -o "models/${PIPER_VOICE}.onnx.json"
          echo "PIPER_MODEL=models/${PIPER_VOICE}.onnx" >> "$GITHUB_ENV"
          echo "PIPER_EXECUTABLE=$GITHUB_WORKSPACE/.venv-piper/bin/piper" >> "$GITHUB_ENV"

      - name: Acquire scene-matched visual assets
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: node src/prepare-project-assets.js

      - name: 7. Recheck script gate immediately before rendering
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
        run: node src/script-gate.js

      - name: 8. Render documentary
        env:
          PROJECT_ID: ${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}
          PIPER_LENGTH_SCALE: ${{ inputs.speaking_rate || '1.0' }}
          TTS_FAKE: ${{ inputs.dry_run == true && '1' || '0' }}
          AMBIENT: ${{ github.event_name == 'push' && '1' || (inputs.ambient_bed && '1' || '0') }}
        run: node src/render-beats.js

      - name: Upload video and review files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hiddenengine-${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}${{ inputs.dry_run == true && '-DRYRUN' || '' }}
          path: |
            dist/${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}/the-hidden-engine-documentary.mp4
            dist/${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}/CREDITS.md
            dist/${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}/QA-REPORT.json
            dist/${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}/contact-sheet.jpg
            dist/${{ inputs.project_id || '2026-11-14-nvidia-hidden-engine' }}/FACT-CHECK-SHEET.md
          if-no-files-found: error
          retention-days: 14
