
name: HiddenEngine Weekly Research

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * 0"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run research
        run: node src/research.js

      - name: Save report
        run: |
          git config user.name "HiddenEngine Agent"
          git config user.email "agent@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Weekly research report"
          git push
